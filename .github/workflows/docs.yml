name: Documentation Website

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-docs:
    name: Build & Verify Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build engine types & API model
        run: npm run api:check

      - name: Build example games
        run: npm run build:games

      - name: Generate API markdown documentation
        run: npm run docs:api

      - name: Sync example game assets
        run: npm run docs:prepare

      - name: Build static documentation website
        run: npm run docs:build

      - name: Verify sitemap and SEO metadata
        run: npm run check:docs:seo

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: flixel-pixi-docs
          path: docs/.vitepress/dist
          retention-days: 14

      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy-docs:
    name: Deploy to GitHub Pages
    needs: build-docs
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
