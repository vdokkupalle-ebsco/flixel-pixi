name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Verify through Phase 4 sprite compatibility
        run: npm run verify

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: ignore
          name: phase-4-reports
          path: |
            coverage/
            playwright-report/
            reports/
            temp/*.api.json
            test-results/
