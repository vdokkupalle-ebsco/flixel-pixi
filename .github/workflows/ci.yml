name: Release verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-desktop:
    name: Verify desktop browsers and package
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          cache: npm
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Verify code, package, and deterministic budgets
        run: npm run verify:quality

      - name: Run complete Chromium browser suite
        run: npm run test:e2e -- --project=chromium

      - name: Verify Firefox can initialize the Pixi renderer
        run: >-
          xvfb-run --auto-servernum
          npx playwright test tests/browser/smoke.spec.ts
          --project=firefox --headed --workers=1 --retries=0

      - name: Run Firefox compatibility contracts
        run: >-
          xvfb-run --auto-servernum
          npm run test:e2e -- --project=firefox --headed

      - name: Run WebKit compatibility contracts
        run: npm run test:e2e -- --project=webkit

      - name: Verify portable performance and resource budgets
        run: npm run verify:budgets

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: ignore
          name: release-hardening-desktop-reports
          retention-days: 7
          path: |
            coverage/
            playwright-report/
            reports/
            temp/*.api.json
            test-results/

  verify-mobile:
    name: Verify mobile browser pressure
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          cache: npm
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install mobile browser engines
        run: npx playwright install --with-deps chromium webkit

      - name: Run mobile browser matrix
        run: npm run test:matrix

      - name: Upload mobile verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: ignore
          name: release-hardening-mobile-reports
          retention-days: 7
          path: |
            playwright-report/
            test-results/
