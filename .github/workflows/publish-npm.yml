name: Publish npm prerelease

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version to publish
        required: true
        type: string

concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  verify-mobile:
    name: Verify mobile browser pressure
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Require an immutable version tag
        env:
          EXPECTED_REF: refs/tags/v${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF" != "$EXPECTED_REF" ]; then
            echo "Run this workflow from $EXPECTED_REF, not $GITHUB_REF." >&2
            exit 1
          fi

      - name: Check out release tag
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          cache: npm
          node-version: 24

      - name: Verify release metadata
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          ACTUAL_VERSION="$(node --input-type=module -e 'import packageJson from "./package.json" with { type: "json" }; process.stdout.write(packageJson.version)')"
          if [ "$ACTUAL_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "package.json is $ACTUAL_VERSION; expected $EXPECTED_VERSION." >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build private runtime workspaces
        run: npm run build:workspaces

      - name: Install mobile browser engines
        run: npx playwright install --with-deps chromium webkit

      - name: Run mobile browser matrix
        run: npm run test:matrix

      - name: Upload mobile verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: ignore
          name: npm-release-mobile-reports
          retention-days: 7
          path: |
            playwright-report/
            test-results/

  publish:
    name: Verify and publish immutable tag
    needs: verify-mobile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm-release

    steps:
      - name: Require an immutable version tag
        env:
          EXPECTED_REF: refs/tags/v${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF" != "$EXPECTED_REF" ]; then
            echo "Run this workflow from $EXPECTED_REF, not $GITHUB_REF." >&2
            exit 1
          fi

      - name: Check out release tag
        uses: actions/checkout@v6

      - name: Set up Node.js and npmjs.org
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify release metadata
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          ACTUAL_VERSION="$(node --input-type=module -e 'import packageJson from "./package.json" with { type: "json" }; process.stdout.write(packageJson.version)')"
          if [ "$ACTUAL_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "package.json is $ACTUAL_VERSION; expected $EXPECTED_VERSION." >&2
            exit 1
          fi
          if [ "$(node --input-type=module -e 'import packageJson from "./package.json" with { type: "json" }; process.stdout.write(String(packageJson.private))')" = "true" ]; then
            echo "package.json is still private; publication is intentionally blocked." >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Verify code, package, and deterministic budgets
        run: npm run verify:quality

      - name: Run complete Chromium browser suite
        run: npm run test:e2e -- --project=chromium

      - name: Verify Firefox can initialize the Pixi renderer
        run: >-
          xvfb-run --auto-servernum
          npx playwright test tests/browser/smoke.spec.ts
          --project=firefox --headed --workers=1 --retries=0

      - name: Run Firefox compatibility contracts
        run: >-
          xvfb-run --auto-servernum
          npm run test:e2e -- --project=firefox --headed

      - name: Run WebKit compatibility contracts
        run: npm run test:e2e -- --project=webkit

      - name: Verify performance and resource budgets
        run: npm run verify:budgets

      - name: Preview npm publication
        run: npm publish --dry-run --access public --tag next

      - name: Publish prerelease with npm trusted publishing
        run: npm publish --access public --tag next

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: ignore
          name: npm-release-verification-reports
          retention-days: 7
          path: |
            coverage/
            playwright-report/
            reports/
            temp/*.api.json
            test-results/
