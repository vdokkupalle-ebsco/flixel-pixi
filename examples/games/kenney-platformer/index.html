<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>flixel-pixi — Kenney Platformer</title>
    <link rel="stylesheet" href="../_kit/shell.css" />
  </head>
  <body>
    <div id="app">
      <header class="bar">
        <div>
          <h1>Kenney Platformer</h1>
          <p
            id="status"
            class="status"
            data-testid="status"
            data-state="loading"
          >
            Initializing…
          </p>
        </div>
        <div class="actions">
          <button type="button" data-action="destroy" disabled>Destroy</button>
        </div>
      </header>
      <div data-testid="canvas-host" class="canvas-host"></div>
      <p
        class="credit"
        style="margin: 8px 12px; color: #64748b; font-size: 12px"
      >
        Art: Kenney Platformer Pack Remastered (CC0) —
        <a href="https://kenney.nl" rel="noopener noreferrer">kenney.nl</a>
      </p>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
