<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>flixel-pixi — Water and Chain Meshes</title>
    <link rel="stylesheet" href="../_kit/shell.css" />
  </head>
  <body>
    <main class="game-shell">
      <header>
        <p class="eyebrow">P2 RENDERING CHECKPOINT</p>
        <h1>Water and Chain Meshes</h1>
        <p>A game-like harbor scene built from deformable triangle geometry.</p>
      </header>
      <section class="game-card" aria-label="Mesh showcase game">
        <div data-testid="canvas-host"></div>
        <div class="game-controls">
          <span data-testid="status" data-state="loading">Loading…</span>
          <button data-action="animate" type="button" disabled>
            Pause geometry
          </button>
          <button data-action="destroy" type="button" disabled>Destroy</button>
        </div>
      </section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
