<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>flixel-pixi replay and determinism</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app">
      <header class="bar">
        <div>
          <h1>Replay and deterministic verification</h1>
          <p
            id="status"
            class="status"
            data-testid="status"
            data-state="loading"
          >
            Initializing replay...
          </p>
        </div>
        <div class="actions">
          <button type="button" data-action="destroy" disabled>Destroy</button>
        </div>
      </header>

      <main class="workbench">
        <section class="stage">
          <div
            data-testid="replay-canvas-host"
            class="canvas-host replay-canvas"
          ></div>
        </section>

        <section
          class="controls"
          style="
            margin-top: 1rem;
            padding: 1rem;
            background: #1a202c;
            border-radius: 8px;
            color: #fff;
          "
        >
          <h3>Replay & VCR Controls</h3>
          <div
            style="
              display: flex;
              gap: 0.5rem;
              flex-wrap: wrap;
              margin-top: 0.5rem;
            "
          >
            <button type="button" data-action="record-replay">● Record</button>
            <button type="button" data-action="stop-recording" disabled>
              ■ Stop Record
            </button>
            <button type="button" data-action="play-replay" disabled>
              ▶ Play
            </button>
            <button type="button" data-action="rewind-replay" disabled>
              ≪ Rewind
            </button>
            <button type="button" data-action="step-frame" disabled>
              ❚❚ Step 1 Frame
            </button>
            <button type="button" data-action="export-as3" disabled>
              Export AS3 Text
            </button>
          </div>
          <div style="margin-top: 1rem">
            <p>
              <strong>Replay Status:</strong>
              <span data-testid="replay-info">Idle</span>
            </p>
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="./replay-main.ts"></script>
  </body>
</html>
