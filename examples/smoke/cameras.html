<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>flixel-pixi cameras</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="cameras">
      <header>
        <div>
          <p class="eyebrow">Cameras</p>
          <h1>Multi-camera rendering</h1>
        </div>
        <button type="button" data-action="destroy" disabled>
          Destroy application
        </button>
      </header>
      <p class="status" data-testid="status">Initializing cameras…</p>
      <div
        class="canvas-host cameras-canvas"
        data-testid="cameras-canvas-host"
      ></div>
      <div data-testid="cameras-metrics" hidden></div>
    </main>
    <script type="module" src="/cameras-main.ts"></script>
  </body>
</html>
