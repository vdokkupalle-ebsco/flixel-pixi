<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>flixel-pixi effects</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="effects">
      <header>
        <div>
          <p class="eyebrow">Effects</p>
          <h1>Particles, timers, and plugins</h1>
        </div>
        <button type="button" data-action="destroy" disabled>
          Destroy application
        </button>
      </header>
      <p class="status" data-testid="status">Initializing effects…</p>
      <div
        class="canvas-host effects-canvas"
        data-testid="effects-canvas-host"
      ></div>
      <div data-testid="effects-metrics" hidden></div>
    </main>
    <script type="module" src="/effects-main.ts"></script>
  </body>
</html>
