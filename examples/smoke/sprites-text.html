<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>flixel-pixi sprites and text</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="sprites-text">
      <header>
        <div>
          <p class="eyebrow">Sprites and text</p>
          <h1>Sprite compatibility</h1>
        </div>
        <button type="button" data-action="destroy" disabled>
          Destroy application
        </button>
      </header>
      <p class="status" data-testid="status">Initializing sprites and text…</p>
      <div
        class="canvas-host sprites-text-canvas"
        data-testid="sprites-text-canvas-host"
      ></div>
      <div data-testid="sprites-text-metrics" hidden></div>
    </main>
    <script type="module" src="/sprites-text-main.ts"></script>
  </body>
</html>
